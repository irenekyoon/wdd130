<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form2.css">
</head>

<body>
    <header>
        <h1>Form Exercises</h1>
    </header>
    <div class="container1">
        <h2>Week 5 HTML Form - User Poll </h1>
            <form>
                <fieldset>
                    <legend>Who Are You?</legend>
                    <div class="form-item column2">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname required">
                    </div>
                    <div class="form-item column2">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail required">
                    </div>
                    <div class="form-item column1">
                        <label for="browser">Select Favorite Browser</label>
                        <select name="browser" id="browser">
                            <option value="chrome">Chrome</option>
                            <option value="safari">Safari</option>
                            <option value="edge">Edge</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-item column1">
                        <label for="pet">Do you have a household pet?</label>
                        <input type="checkbox" id="pet" name="pet">
                    </div>
                    <div class="form-item column1">
                        <label for="feedback">List the places you have lived:</label>
                        <textarea id="feedback" name="feedback" rows="4"
                            placeholder="Provo Utah, Paris France, Pusan Korea"></textarea>
                    </div>
                    <button type="submit">Submit Poll</button>
                </fieldset>

            </form>
    </div>
    <div class="container2">

        <h2>General Conference Word Frequency Analyzer</h1>
            <form>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">Email: </label>
                <input type="email" id="useremail" name="useremail" required>

                <label for="talk">Select General Conference Talk</label>
                <select name="talk" id="talk">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="intro">Introduction</option>
                    <option value="main-talk">Alive in Christ</option>
                    <option value="closing">Closing Remarks</option>
                </select>
                <fieldset>
                    <legend>Number of words</legend>
                    <label for="5">5</label>
                    <input type="radio" id="5" name="number" value="5">

                    <label for="10">10</label>
                    <input type="radio" id="10" name="number" value="10">

                    <label for="20">20</label>
                    <input type="radio" id="20" name="number" value="20">
                </fieldset>
                <button>
                    <label for="submit">Submit your preferences</label>
                </button>


            </form>
    </div>
    <div class="centering">
        <p>Content</p>
    </div>
</body>

</html>
