<!DOCTYPE html>
<html lang="en">

<head>

        content="Contact us for general inquiries or questions about your reservation, or even website suggestions, as well as our address and a map to find us.">

    <header>

        <nav>

    <main>
        <div class="address">
            <h1>Whitewater Rafting Co</h1>
            <div>
                <p>1020 10th St S </p>
                <p>Golden, BC </p>
                <p>V0A 1H0</p>
                <p>Canada</p>
            </div>
        </div>

        <section class="contact">
            <h2>Map and Contact Form</h2>
            <div>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2494.8655244248775!2d-116.96450642480599!3d51.29519872618502!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5379bf90bf93b443%3A0x7ba554c9c8f391d0!2s1020%2010th%20St%20S%2C%20Golden%2C%20BC%20V0A%201H0%2C%20Canada!5e0!3m2!1sen!2sph!4v1784980207942!5m2!1sen!2sph"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <form action="">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="general inquiry">general inquiry</label>
                <input type="radio" id="general inquiry" name="general inquiry">

                <label for="general inquiry">general inquiry</label>
                <input type="radio" id="general inquiry" name="general inquiry">

                <label for="general inquiry">general inquiry</label>
                <input type="radio" id="general inquiry" name="general inquiry">

                <label for="message">Message</label>
                <textarea name="message" id="message" rows="4"></textarea>

                <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to the month
                    newsletter</label>

                <button type="submit">Get in touch!</button>

            </form>


        </section>
        <section class="serve">
            <h2>Serve You!</h2>
            <figure><img src="images/guide.webp" alt="Whitewater Co's guide extraordinaire, Peter">
                <figcaption>Outdoor Guide</figcaption>
            </figure>
            <figure><img src="images/sales.webp" alt="Whitewater Rafting Co's sales manager, Nicole Nyguyen">
                <figcaption>Sales Manager</figcaption>
            </figure>
            <figure><img src="images/it.webp" alt="Head of Whitewater Rafting Co's IT department, Wilford Wood">
                <figcaption>IT Department</figcaption>
            </figure>
        </section>
