<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us: Whitewater Rafting Co</title>
    <meta name="description"
        content="Contact us for general inquiries or questions about your reservation, or even website suggestions, as well as our address and a map to find us.">
    <meta name="author" content="Irene Yoon">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png"
            alt="The words, Whitewater Rafting on a brown rectangular background on top of a blue wave splash, encircled by two blue circles">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="location">
            <h1>Whitewater Rafting Co</h1>
            <div>
                <p class="special1">1020 10th St S, Golden, BC V0A 1H0 Canada</p>
                <p class="special2">Phone: 250-344-8888 | Email: info@whitewaterraftingco.ca</p>
            </div>
        </div>

        <div class="contact">
            <!-- <section class="contact">
            <h2>Map and Contact Form</h2> -->
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2494.8655244248885!2d-116.96450642468375!3d51.29519872618482!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5379bf90bf93b443%3A0x7ba554c9c8f391d0!2s1020%2010th%20St%20S%2C%20Golden%2C%20BC%20V0A%201H0%2C%20Canada!5e0!3m2!1sen!2sph!4v1785150519040!5m2!1sen!2sph"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>

            </div>

            <form>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="placeholder">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="placeholder">
                </div>
                <div class="radio">
                    <p>Message Purpose</p>
                    <div class="message">
                        <input type="radio" id="general-inquiry" name=message-purpose>
                        <label for="general-inquiry">General Inquiry</label>

                        <input type="radio" id="reservation" name=message-purpose>
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="website-suggestion" name=message-purpose>
                        <label for="website-suggestion">Website Suggestion</label>
                    </div>
                </div>
                <div class="write">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"></textarea>
                </div>

                <div>
                    <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to the monthly
                        newsletter</label>
                </div>

                <div>
                    <button type="submit">Get in touch!</button>
                </div>

            </form>
        </div>

        <!-- </section> -->
        <section class="serve">
            <h2>We Are Here to Serve You</h2>
            <figure class="serve1"><img src="images/guide.webp" alt="Whitewater Co's guide extraordinaire, Peter">
                <figcaption class="serve2">Outdoor Guide</figcaption>
            </figure>
            <figure class="serve1"><img src="images/sales.webp"
                    alt="Whitewater Rafting Co's sales manager, Nicole Nyguyen">
                <figcaption class="serve2">Sales Manager</figcaption>
            </figure>
            <figure class="serve1"> <img src="images/it-worker.webp"
                    alt="Head of Whitewater Rafting Co's IT department, Wilford Wood">
                <figcaption class="serve2">IT Department</figcaption>
            </figure>
        </section>

    </main>
    <footer>
        <p>©2026 | Whitewater Rafting Co | Irene Yoon</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram Icon"></a>
            <a href="https://youtube.com"><img src="images/youtube.svg" alt="YouTube Icon"></a>
        </nav>
    </footer>
</body>

</html>
